[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeforge-backend"
version = "0.1.0"
description = "ResumeForge backend — AI-powered resume and career platform (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "sentence-transformers>=2.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
ml = [
    "pandas>=2.2",
    "datasets>=2.20",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ml*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Heavy third-party deps (ML/parsing libs without stable py3.11-compatible
# stubs) are not analysed so mypy keeps working for our own code. Their
# runtime behaviour is exercised by the test suite instead.
module = [
    "sentence_transformers",
    "sentence_transformers.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "tokenizers",
    "tokenizers.*",
    "numpy",
    "numpy.*",
    "pandas",
    "pandas.*",
    "matplotlib",
    "matplotlib.*",
    "pyarrow",
    "pyarrow.*",
    "contourpy",
    "contourpy.*",
    "scipy",
    "scipy.*",
    "datasets",
    "datasets.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "pypdf",
    "pypdf.*",
    "PIL",
    "PIL.*",
    "rich",
    "rich.*",
]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: downloads a real embedding model; run with -m integration",
    "network: downloads a real dataset over the network; run with -m network",
]
