# ResumeForge dev infrastructure (all free/open-source, ₹0 cost)
# Run: docker compose up -d

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: resumeforge-db
    environment:
      POSTGRES_USER: resumeforge
      POSTGRES_PASSWORD: resumeforge
      POSTGRES_DB: resumeforge
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: resumeforge-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: resumeforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:                        
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  db_data:
  minio_data:
